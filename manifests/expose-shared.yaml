# 1. NodePort Service on the Host Cluster
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: k3k-shared
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30080
---
# 2. LoadBalancer Service on the Host Cluster
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
  namespace: k3k-shared
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
---
# 3. ClusterIP Service + Ingress on the Host Cluster
apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip
  namespace: k3k-shared
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: k3k-shared
spec:
  rules:
  - host: nginx-shared.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-clusterip
            port:
              number: 80