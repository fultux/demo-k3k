apiVersion: k3k.io/v1beta1
kind: VirtualClusterPolicy
metadata:
  name: tenant-policy
  namespace: k3k-virtual
spec:
  resourceQuota:
    hard:
      requests.cpu: "4"
      requests.memory: 8Gi
      limits.cpu: "8"
      limits.memory: 16Gi
      pods: "20"
      services: "10"
  limitRange:
    limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      type: Container
  disableNetworkPolicy: false
  podSecurityStandards:
    enforce: restricted
    enforceVersion: latest
    warn: restricted
    warnVersion: latest
    audit: restricted
    auditVersion: latest